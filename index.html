<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Business Messenger</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --accent: #007acc;
            --text: #cccccc;
            --border: #3e3e42;
            --danger: #f44336;
            --success: #4caf50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Основная рабочая область */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Видео секция */
        .video-section {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* PiP окно */
        .pip-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            aspect-ratio: 16/9;
            background: #111;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
            overflow: hidden;
            border-radius: 4px;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .status-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .dot.active { background: var(--success); box-shadow: 0 0 5px var(--success); }

        /* Чат справа */
        .chat-section {
            width: 350px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            background: #2d2d2d;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
        }
        .msg.sent { background: var(--accent); color: white; align-self: flex-end; }
        .msg.received { background: #3e3e42; align-self: flex-start; }
        .msg.sys { color: #888; font-size: 12px; text-align: center; align-self: center; margin: 5px 0; }

        .chat-input {
            padding: 15px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            background: #3c3c3c;
            border: 1px solid #3c3c3c;
            color: white;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }
        .chat-input input:focus { border-color: var(--accent); }

        /* Нижняя панель управления */
        .control-bar {
            height: 70px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        /* Блок выбора собеседника (Центр) */
        .connection-block {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .id-input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .id-input-group i {
            position: absolute;
            left: 10px;
            color: #888;
        }

        #remoteIdInput {
            background: #3c3c3c;
            border: 1px solid var(--border);
            color: white;
            padding: 10px 10px 10px 35px;
            border-radius: 4px;
            width: 250px;
            font-size: 14px;
        }

        .btn-call {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-call:hover { background: #43a047; }
        .btn-call:disabled { background: #333; color: #666; cursor: not-allowed; }

        .btn-hangup {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            display: none; /* Скрыта по умолчанию */
        }

        /* Блок медиа-контролов (Слева) */
        .media-controls {
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: #333;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .ctrl-btn:hover { background: #444; }
        .ctrl-btn.active { background: white; color: black; }
        .ctrl-btn.disabled { background: #f44336; color: white; border-color: #f44336; }

        /* Блок моего ID (Справа, компактный) */
        .my-id-block {
            text-align: right;
            min-width: 150px;
        }
        .my-id-label { font-size: 11px; color: #888; margin-bottom: 4px; }
        .my-id-val { 
            font-family: monospace; 
            background: #333; 
            padding: 4px 8px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 13px;
            border: 1px solid transparent;
        }
        .my-id-val:hover { border-color: #666; }

    </style>
</head>
<body>

    <div class="workspace">
        <div class="video-section">
            <div class="status-badge">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">Инициализация...</span>
            </div>
            
            <video id="remoteVideo" autoplay playsinline></video>
            
            <div class="pip-container">
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">Чат</div>
            <div class="chat-messages" id="chatMessages">
                <div class="msg sys">Ожидание подключения...</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Сообщение..." disabled>
                <button onclick="sendMsg()" style="background:var(--accent); border:none; color:white; padding:0 15px; border-radius:4px; cursor:pointer;">➤</button>
            </div>
        </div>
    </div>

    <div class="control-bar">
        <!-- Медиа кнопки -->
        <div class="media-controls">
            <button class="ctrl-btn active" id="btnMic" onclick="toggleMic()" title="Микрофон">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="ctrl-btn active" id="btnCam" onclick="toggleCam()" title="Камера">
                <i class="fas fa-video"></i>
            </button>
            <button class="ctrl-btn" id="btnScreen" onclick="toggleScreen()" title="Демонстрация экрана">
                <i class="fas fa-desktop"></i>
            </button>
        </div>

        <!-- Центр: Выбор собеседника -->
        <div class="connection-block">
            <div class="id-input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="remoteIdInput" placeholder="ID собеседника">
            </div>
            <button class="btn-call" id="btnCall" onclick="makeCall()">
                <i class="fas fa-phone"></i> Вызов
            </button>
            <button class="btn-hangup" id="btnHangup" onclick="endCall()">
                <i class="fas fa-phone-slash"></i> Завершить
            </button>
        </div>

        <!-- Мой ID -->
        <div class="my-id-block">
            <div class="my-id-label">Ваш ID (нажми чтобы скопировать)</div>
            <div class="my-id-val" id="myIdDisplay" onclick="copyId()">Загрузка...</div>
        </div>
    </div>

    <script>
        // --- PeerJS Config ---
        const peer = new Peer(null, {
            debug: 2,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        });

        let localStream;
        let currentCall;
        let dataConn;
        let isMicOn = true;
        let isCamOn = true;

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const myIdDisplay = document.getElementById('myIdDisplay');
        
        const btnCall = document.getElementById('btnCall');
        const btnHangup = document.getElementById('btnHangup');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');

        // 1. Инициализация камеры
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                statusText.innerText = "Готов к работе";
            })
            .catch(err => {
                statusText.innerText = "Нет доступа к камере";
                console.error(err);
            });

        // 2. Получение ID
        peer.on('open', id => {
            myIdDisplay.innerText = id;
        });

        // 3. Входящий звонок
        peer.on('call', call => {
            if(confirm(`Входящий звонок от ${call.peer}. Принять?`)) {
                call.answer(localStream);
                handleCall(call);
            }
        });

        // 4. Входящее соединение чата
        peer.on('connection', conn => {
            setupChat(conn);
        });

        // --- ФУНКЦИИ ИНТЕРФЕЙСА ---

        function makeCall() {
            const remoteId = document.getElementById('remoteIdInput').value.trim();
            if(!remoteId) return alert("Введите ID!");
            
            statusText.innerText = "Звоним...";
            const call = peer.call(remoteId, localStream);
            handleCall(call);
            
            // Автоматически открываем чат
            const conn = peer.connect(remoteId);
            conn.on('open', () => setupChat(conn));
        }

        function handleCall(call) {
            currentCall = call;
            
            // UI обновления
            btnCall.style.display = 'none';
            btnHangup.style.display = 'block';
            document.getElementById('remoteIdInput').disabled = true;
            
            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
                statusText.innerText = "Звонок идет";
                statusDot.classList.add('active');
            });

            call.on('close', resetUI);
            call.on('error', err => {
                console.error(err);
                resetUI();
            });
        }

        function endCall() {
            if(currentCall) currentCall.close();
            if(dataConn) dataConn.close();
            resetUI();
        }

        function resetUI() {
            remoteVideo.srcObject = null;
            btnCall.style.display = 'flex';
            btnHangup.style.display = 'none';
            document.getElementById('remoteIdInput').disabled = false;
            statusText.innerText = "Звонок завершен";
            statusDot.classList.remove('active');
            currentCall = null;
        }

        // Управление медиа
        function toggleMic() {
            if(!localStream) return;
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            
            const btn = document.getElementById('btnMic');
            btn.className = isMicOn ? 'ctrl-btn active' : 'ctrl-btn disabled';
            btn.innerHTML = isMicOn ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
        }

        function toggleCam() {
            if(!localStream) return;
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;
            
            const btn = document.getElementById('btnCam');
            btn.className = isCamOn ? 'ctrl-btn active' : 'ctrl-btn disabled';
            btn.innerHTML = isCamOn ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
        }

        async function toggleScreen() {
            if(!currentCall) return alert("Сначала начните звонок");
            
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const videoTrack = screenStream.getVideoTracks()[0];
                
                // Заменяем трек в звонке
                const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if(sender) sender.replaceTrack(videoTrack);
                
                localVideo.srcObject = screenStream;
                document.getElementById('btnScreen').classList.add('active');
                
                // Возврат камеры при остановке трансляции
                videoTrack.onended = () => {
                    const camTrack = localStream.getVideoTracks()[0];
                    sender.replaceTrack(camTrack);
                    localVideo.srcObject = localStream;
                    document.getElementById('btnScreen').classList.remove('active');
                };
            } catch(e) { console.error(e); }
        }

        // Чат
        function setupChat(conn) {
            dataConn = conn;
            chatInput.disabled = false;
            addMsg("Чат подключен", "sys");
            
            dataConn.on('data', data => {
                addMsg(data, "received");
            });
        }

        function sendMsg() {
            const text = chatInput.value.trim();
            if(text && dataConn) {
                dataConn.send(text);
                addMsg(text, "sent");
                chatInput.value = '';
            }
        }
        
        chatInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendMsg(); });

        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function copyId() {
            const id = myIdDisplay.innerText;
            if(id === 'Загрузка...') return;
            navigator.clipboard.writeText(id);
            const old = myIdDisplay.innerText;
            myIdDisplay.innerText = "Скопировано!";
            setTimeout(() => myIdDisplay.innerText = old, 1500);
        }
    </script>
</body>
</html>
